name: "Report to Wire"
description: "Sends a Wire message about a workflow result."

inputs:
  webhook-url:
    description: "The Wire webhook URL to send the notification to"
    required: true
  webhook-token:
    description: "The Wire webhook token to send the notification to"
    required: true
  body:
    description: "Additional message body to include in the notification (supports markdown)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Notify
      if: ${{ inputs.body != '' }}
      continue-on-error: true
      uses: wireapp/github-app/.github/actions/notify-wire@v1
      with:
        webhook-url: ${{ inputs.webhook-url }}
        token: ${{ inputs.webhook-token }}
        text: ${{ inputs.body }}
