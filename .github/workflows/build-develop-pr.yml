name: "Develop"

on:
  merge_group:
    types: [ checks_requested ]
    branches: [ develop ]
  pull_request:
    branches:
      - develop
    types: [ opened, synchronize ]

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  # CI checks for PR and merge group validation (no build, no deployment)
  build-validation:
    permissions:
      contents: write
      actions: read
      security-events: write
    uses: ./.github/workflows/build-unified.yml
    with:
      concurrency-group-suffix: pr
    secrets: inherit
