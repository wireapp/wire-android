name: "Develop Push"

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build for direct pushes to develop (includes alpha flavor deployment to the internal store)
  build-develop:
    permissions:
      contents: write
      actions: read
      security-events: write
    uses: ./.github/workflows/build-unified.yml
    with:
      concurrency-group-suffix: push
      build-config: |
        [
          {
            "flavor": "Alpha",
            "variant": "Compat",
            "keystore-type": "internal",
            "build-type": "both",
            "generate-version-file": false,
            "deployment-targets": [
              {
                "type": "s3"
              },
              {
                "type": "google-play",
                "package-name": "com.wire.internal",
                "track": "${{ vars.INTERNAL_APP_TRACK }}",
                "status": "completed"
              }
            ]
          }
        ]
      parallel-build: true
      enable-deployment: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      ENCODED_KEYSTORE_INTERNAL_RELEASE: ${{ secrets.ENCODED_KEYSTORE_INTERNAL_RELEASE }}
      SIGNING_KEY_ALIAS_INTERNAL_RELEASE: ${{ secrets.SIGNING_KEY_ALIAS_INTERNAL_RELEASE }}
      SIGNING_KEY_PASSWORD_INTERNAL_RELEASE: ${{ secrets.SIGNING_KEY_PASSWORD_INTERNAL_RELEASE }}
      SIGNING_STORE_PASSWORD_INTERNAL_RELEASE: ${{ secrets.SIGNING_STORE_PASSWORD_INTERNAL_RELEASE }}
      DATADOG_APP_ID: ${{ secrets.DATADOG_APP_ID }}
      DATADOG_CLIENT_TOKEN: ${{ secrets.DATADOG_CLIENT_TOKEN }}
      ENABLE_SIGNING: ${{ secrets.ENABLE_SIGNING }}
      DOMAIN_REMOVAL_KEYS_FOR_REPAIR: ${{ secrets.DOMAIN_REMOVAL_KEYS_FOR_REPAIR }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
