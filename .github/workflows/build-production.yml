name: "Production"

on:
  release:
    types: [ published ]

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    # Skip if this is a pre-release (tag contains -rc, -alpha, -beta, etc.)
    # Pre-release tags should use dedicated workflows (e.g., build-rc.yml)
    if: ${{ !contains(github.event.release.tag_name, '-') }}
    steps:
      - name: Get latest release tag
        id: get_latest_release
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          latest_tag=$(curl -s "https://api.github.com/repos/$REPOSITORY/releases/latest" | jq -r '.tag_name')
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Compare versions
        env:
          CURRENT_TAG: ${{ github.event.release.tag_name }}
          LATEST_TAG: ${{ steps.get_latest_release.outputs.latest_tag }}
        run: |
          current_tag="$CURRENT_TAG"
          latest_tag="$LATEST_TAG"
          cur_ver="${current_tag#v}"
          lat_ver="${latest_tag#v}"
          highest="$(printf '%s\n%s' "$cur_ver" "$lat_ver" | sort -V | tail -n1)"
          if [[ "$cur_ver" != "$lat_ver" && "$highest" != "$cur_ver" ]]; then
            echo "Current tag ($current_tag) is lower than latest tag ($latest_tag). Failing the workflow."
            exit 1
          else
            echo "Current tag ($current_tag) is equal or higher than $latest_tag. Continuing the workflow."
          fi

  release-log-context:
    name: Export release log context
    if: github.event_name == 'release' && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Export release context
        continue-on-error: true
        run: |
          mkdir -p release-log
          make release-log/context event="$GITHUB_EVENT_PATH" output=release-log/evidence.json

      - name: Upload release context
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-log-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-log/evidence.json
          retention-days: 90

  build-production:
    needs: validate-release
    permissions:
      contents: write
      actions: read
      security-events: write
    uses: ./.github/workflows/build-unified.yml
    with:
      concurrency-group-suffix: prod
      build-config: |
        [
          {
            "flavor": "Prod",
            "variant": "Compatrelease",
            "keystore-type": "public",
            "build-type": "both",
            "generate-version-file": true,
            "export-release-log": true,
            "deployment-targets": [
              {
                "type": "s3"
              },
              {
                "type": "google-play",
                "package-name": "com.wire",
                "track": "${{ vars.PROD_APP_RELEASE_TRACK }}",
                "user-fraction": 0.1,
                "status": "inProgress"
              },
              {
                "type": "github-release",
                "additional-files": "app/build/outputs/version.txt"
              }
            ]
          }
        ]
      enable-deployment: true
    secrets: inherit

  build-fdroid:
    needs: validate-release
    permissions:
      contents: write
      actions: read
      security-events: write
    uses: ./.github/workflows/build-unified.yml
    with:
      concurrency-group-suffix: fdroid
      build-config: |
        [
          {
            "flavor": "Fdroid",
            "variant": "Compatrelease",
            "keystore-type": "public",
            "build-type": "apk",
            "generate-version-file": false,
            "deployment-targets": [
              {
                "type": "s3"
              }
            ]
          }
        ]
      enable-deployment: true
    secrets: inherit
