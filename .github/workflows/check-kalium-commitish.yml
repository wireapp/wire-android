name: "Validate Kalium References"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-kalium-ref:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Compare Kalium references
        id: validate_kalium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          pin_at() {
            gh api "repos/$REPOSITORY/git/trees/$1" --jq '.tree[] | select(.path == "kalium" and .mode == "160000") | .sha'
          }
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            BASE_SHA="$(gh api "repos/$REPOSITORY/git/commits/$HEAD_SHA" --jq '.parents[0].sha')"
          fi
          from="$(pin_at "$BASE_SHA")"
          to="$(pin_at "$HEAD_SHA")"
          if [[ ! "$from" =~ ^[0-9a-f]{40}$ || ! "$to" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve Kalium pins for $BASE_SHA and $HEAD_SHA"
            exit 1
          fi
          echo "kalium_from=$from" >> "$GITHUB_OUTPUT"
          echo "kalium_to=$to" >> "$GITHUB_OUTPUT"
          if [[ "$from" == "$to" ]]; then
            echo "Kalium pin is unchanged."
            exit 0
          fi

          rollback_status="$(gh api "repos/wireapp/kalium/compare/$from...$to" --jq .status)"
          case "$rollback_status" in
            behind|diverged) echo "is_kalium_rollback=1" >> "$GITHUB_OUTPUT" ;;
            ahead|identical) ;;
            *) echo "::error::Unexpected Kalium comparison status: $rollback_status"; exit 1 ;;
          esac

          base_ref="${BASE_REF#refs/heads/}"
          if [[ "$base_ref" == develop ]]; then
            branch=develop
          elif [[ "$base_ref" == release/cycle-* ]]; then
            if [[ ! "$base_ref" =~ ^release/cycle-([0-9]+\.[0-9]+)(\.[0-9]+)?(-.+)?$ ]]; then
              echo "::error::Cannot map Kalium release branch for $base_ref"
              exit 1
            fi
            prefix="release/android-cycle-${BASH_REMATCH[1]}"
            exact="$prefix${BASH_REMATCH[2]}"
            branches="$(gh api --paginate "repos/wireapp/kalium/git/matching-refs/heads/$prefix" --jq '.[].ref' | sed 's|^refs/heads/||')"
            matches=()
            while IFS= read -r candidate; do
              if [[ "$candidate" == "$exact" ]]; then
                matches=("$candidate")
                break
              fi
              if [[ "$candidate" == "$prefix" || "$candidate" =~ ^${prefix//./\.}\.([0-9]+|x)$ ]]; then
                matches+=("$candidate")
              fi
            done <<< "$branches"
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::Expected one Kalium branch matching $prefix (optionally with a patch version); found ${#matches[@]}"
              exit 1
            fi
            branch="${matches[0]}"
          else
            echo "No Kalium target branch configured for $base_ref."
            exit 0
          fi
          status="$(gh api "repos/wireapp/kalium/compare/$branch...$to" --jq .status)"
          case "$status" in
            behind|identical) echo "Kalium pin $to is on $branch ($status)." ;;
            ahead|diverged) echo "invalid_pin=1" >> "$GITHUB_OUTPUT"; echo "branch=$branch" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected Kalium comparison status: $status"; exit 1 ;;
          esac

      - name: Leave a comment
        if: ${{ github.event_name == 'pull_request' && steps.validate_kalium.outputs.is_kalium_rollback == '1' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KALIUM_FROM: ${{ steps.validate_kalium.outputs.kalium_from }}
          KALIUM_TO: ${{ steps.validate_kalium.outputs.kalium_to }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@$PR_AUTHOR looks like you are rolling back kalium to a previous commitish.

          This means that the PR's target branch ($GH_BASE_REF) is using a newer version of Kalium, and the changes in this PR will rollback Kalium to an older version.

          | $GH_BASE_REF | This PR |
          | ------------ | ------- |
          | [$KALIUM_FROM](https://github.com/wireapp/kalium/tree/$KALIUM_FROM) | [$KALIUM_TO](https://github.com/wireapp/kalium/tree/$KALIUM_TO) |

          Is this intentional?"

      - name: Reject pin outside target branch
        if: ${{ always() && steps.validate_kalium.outputs.invalid_pin == '1' }}
        env:
          PIN: ${{ steps.validate_kalium.outputs.kalium_to }}
          BRANCH: ${{ steps.validate_kalium.outputs.branch }}
        run: |
          echo "::error::Kalium pin $PIN is not on $BRANCH"
          exit 1
