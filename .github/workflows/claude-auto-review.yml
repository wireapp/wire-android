name: Claude Auto Review

# Classifies every pull request into a review tier (0 skip, 1 light, 2 deep)
# and starts a Claude review that matches the tier.
#
# The review job runs only when the repository variable CLAUDE_AUTO_REVIEW is set:
#   shadow  Claude reviews and the result goes to the job summary. It posts nothing on the PR.
#   on      Claude posts inline comments and one summary comment.
# Any other value, or no value, runs the classifier only.
#
# The review is advisory. Do not add it to the required checks.
# `@claude review` in a comment still starts a manual review (claude-code-review.yml).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]

concurrency:
  group: claude-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    # Skip drafts and fork PRs. Fork PRs have no access to secrets.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      reasons: ${{ steps.classify.outputs.reasons }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # The classifier diffs against the merge base

      - name: Classify
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          result=$(scripts/review-tier/classify-pr.sh "$BASE_SHA" "$HEAD_SHA" "$PR_AUTHOR")
          tier=$(jq -r '.tier' <<<"$result")
          reasons=$(jq -r '.reasons | map("- " + .) | join("\n")' <<<"$result")
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "tier=$tier"
            echo "reasons<<$delimiter"
            echo "$reasons"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Review tier: $tier"
            echo "$reasons"
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    needs: classify
    if: |
      needs.classify.outputs.tier != '0' &&
      (vars.CLAUDE_AUTO_REVIEW == 'shadow' || vars.CLAUDE_AUTO_REVIEW == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Build prompt
        id: prompt
        env:
          TIER: ${{ needs.classify.outputs.tier }}
          REASONS: ${{ needs.classify.outputs.reasons }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODE_DIR: .
          DELIVERY: ${{ vars.CLAUDE_AUTO_REVIEW == 'on' && 'inline' || 'summary' }}
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "text<<$delimiter"
            .github/review/build-prompt.sh
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: ${{ vars.CLAUDE_AUTO_REVIEW == 'on' }}
          display_report: true
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --max-turns ${{ needs.classify.outputs.tier == '2' && '25' || '10' }}
            --allowed-tools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)${{ needs.classify.outputs.tier == '2' && ',Task' || '' }}${{ vars.CLAUDE_AUTO_REVIEW == 'on' && ',mcp__github_inline_comment__create_inline_comment' || '' }}"
