name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    # Only run when the comment contains the trigger phrase,
    # and when the commenter is a maintainer/team member,
    # and when it's on a pull request (not an issue)
    if: |
      github.event.issue.pull_request &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      contains(github.event.comment.body, '@claude review') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Get PR number
        id: pr-info
        run: |
          # For issue_comment events, use github.event.issue.number
          # For pull_request_review_comment events, use github.event.pull_request.number
          if [ "${{ github.event.issue.number }}" != "" ]; then
            echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout pull request code
        # The prompt files come from the base checkout above. The PR code goes into pr/,
        # so a pull request cannot change the prompt that reviews it.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ steps.pr-info.outputs.pr_number }}/head
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Post initial comment
        id: initial-comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ steps.pr-info.outputs.pr_number }}/comments \
            -f body="🤖 Beep boop! Claude is putting on their reading glasses and diving into your code...

          ⏳ This comment will be updated with the review results once I'm done pondering the mysteries of your implementation.

          _In the meantime, feel free to grab a coffee ☕ - reviewing code is serious business!_" \
            --jq '.id')
          echo "comment_id=$COMMENT_ID" >> $GITHUB_OUTPUT

      - name: Build prompt
        id: prompt
        env:
          TIER: "2" # A manual request gets the deep review
          REASONS: "- requested with @claude review"
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          CODE_DIR: pr
          DELIVERY: comment:${{ steps.initial-comment.outputs.comment_id }}
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "text<<$delimiter"
            .github/review/build-prompt.sh
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.text }}

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/sdk#command-line for available options
          claude_args: '--max-turns 25 --allowed-tools "Read,Grep,Glob,Task,Bash(gh api:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
