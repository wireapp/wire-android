name: "Generate Baseline Profile"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-baseline-profile
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.ANDROID_BOB_GH_TOKEN }}
  BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'develop' }}
  REFRESH_BRANCH: chore/baseline-profile-refresh
  OP_VAULT: "Test Automation"
  TARGET_PACKAGE: com.wire

jobs:
  generate:
    name: Generate baseline profile (prod compatrelease)
    runs-on:
      - self-hosted
      - Linux
      - X64
      - office
      - android-qa
    timeout-minutes: 90

    env:
      # Set BASELINE_PROFILE_DEVICE_SERIAL to a phone verified to generate nonempty profiles.
      # An unset or unavailable selection must fail, never fall back to all connected phones.
      ANDROID_SERIAL: ${{ vars.BASELINE_PROFILE_DEVICE_SERIAL }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          clean: true
          fetch-depth: 1 # Keep the large Kalium submodule checkout shallow
          submodules: recursive

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          isolate-gradle-home: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4

      - name: Fetch runtime secrets
        run: OP_SERVICE_ACCOUNT_TOKEN="${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}" make qa-ui-setup cmd=fetch-runtime-secrets

      # Baseline profile generation doesn't need production signing.
      # The test APK is installed via adb and never distributed.
      # ENABLE_SIGNING=FALSE makes both release and compatrelease use debug signing.
      - name: Disable production signing
        run: echo "ENABLE_SIGNING=FALSE" >> "$GITHUB_ENV"

      - name: Verify selected baseline profile device
        run: |
          if [[ -z "$ANDROID_SERIAL" || "$ANDROID_SERIAL" =~ [[:space:],] ]]; then
            echo "::error::Set BASELINE_PROFILE_DEVICE_SERIAL to exactly one device serial without whitespace or commas."
            exit 1
          fi

          if ! DEVICE_STATE="$(adb -s "$ANDROID_SERIAL" get-state | tr -d '\r')" || [[ "$DEVICE_STATE" != "device" ]]; then
            echo "::error::The selected baseline profile device is not online. Check BASELINE_PROFILE_DEVICE_SERIAL and its ADB connection."
            exit 1
          fi

          if ! DEVICE_SDK="$(adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" || [[ ! "$DEVICE_SDK" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read a valid Android API level from the selected baseline profile device."
            exit 1
          fi

          if (( 10#$DEVICE_SDK < 33 )); then
            echo "::error::Baseline profile generation requires API 33+ without root; the selected device uses API $DEVICE_SDK."
            exit 1
          fi

      - name: Capture device metadata
        id: device
        run: |
          echo "model=$(adb -s "$ANDROID_SERIAL" shell getprop ro.product.model | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "sdk=$(adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Generate baseline + startup profile
        run: |
          make baseline-profile

          mkdir -p app/src/main
          cp app/src/prodCompatrelease/generated/baselineProfiles/baseline-prof.txt app/src/main/baseline-prof.txt
          cp app/src/prodCompatrelease/generated/baselineProfiles/startup-prof.txt app/src/main/startup-prof.txt

      - name: Verify generated profiles
        run: |
          test -s app/src/main/baseline-prof.txt
          test -s app/src/main/startup-prof.txt

      - name: Upload generated profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-profile-${{ github.run_id }}
          path: |
            app/src/prodCompatrelease/generated/baselineProfiles/*
          if-no-files-found: error

      - name: Create or update baseline profile PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.ANDROID_BOB_GH_TOKEN }}
          branch: ${{ env.REFRESH_BRANCH }}-${{ env.BASE_BRANCH }}
          base: ${{ env.BASE_BRANCH }}
          title: "chore(perf): refresh baseline and startup profiles (WPB-8645)"
          commit-message: "chore: refresh baseline profile"
          body: |
            Auto-generated baseline profile refresh.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            performance
          add-paths: |
            app/src/main/baseline-prof.txt
            app/src/main/startup-prof.txt
          delete-branch: false

      - name: Stop isolated Gradle daemons
        if: always()
        continue-on-error: true
        run: ./gradlew --stop
