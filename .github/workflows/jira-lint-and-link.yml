name: Link and Lint PR with Jira Ticket Number
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    # Skip for fork PRs — head.repo.full_name differs from the base repo for forks
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Get version name from source
        id: version
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CHANGED_FILES" == 1 ]]; then
            FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=2" --jq '.[].filename')
            if [[ "$FILES" == kalium ]]; then
              echo "Android assigns fix versions after a Kalium ref update lands."
              exit 0
            fi
          fi

          VERSION=$(curl -s "https://raw.githubusercontent.com/${REPO}/${BRANCH}/build-logic/plugins/src/main/kotlin/AndroidCoordinates.kt" | grep 'const val versionName' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"

  add-jira-description:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: get-version
    uses: wireapp/.github/.github/workflows/jira-link-pr-reusable.yml@b00595235816b9a935c7463b990fae39864903a5
    with:
      skip-branches: '^(production-release|main|master|release\/v\d+)$'
      skip-actors: 'dependabot[bot],renovate[bot],AndroidBob'
      version-name: ${{ needs.get-version.outputs.version_name }}
      fix-version-regex: '(?:^|[\s\-_])(v?\d+\.\d+(?:\.\d+)?(?:[\-\+][\w\.\-]*)?)'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      jira-token: ${{ secrets.JIRA_TOKEN }}
