name: QA Reporting Repository Access Check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-access:
    name: Verify Android Bob upload and workflow access
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      REPORTING_REPOSITORY: wireapp/android-e2etest-reports
      RECEIVING_WORKFLOW: verify-android-handoff.yml
      BOT_LOGIN: ${{ vars.BOT_LOGIN }}
      BOT_ID: ${{ vars.BOT_ID }}

    steps:
      - name: Check out the reporting repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.REPORTING_REPOSITORY }}
          token: ${{ secrets.ANDROID_BOB_GH_TOKEN }}
          path: reports
          fetch-depth: 1

      - name: Push dummy results, trigger the receiver and wait
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ANDROID_BOB_GH_TOKEN }}
        run: |
          set -euo pipefail

          check_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd reports
          git switch -c "ci/report-access-${check_id}"
          printf '{"source_repository":"wireapp/wire-android","check_id":"%s","dummy":true}\n' \
            "${check_id}" > handoff-check.json
          git add handoff-check.json
          git -c "user.name=${BOT_LOGIN}" \
              -c "user.email=${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com" \
              commit -m "ci: verify report handoff ${check_id}"
          git push origin "ci/report-access-${check_id}"

          ref=$(gh api "repos/${REPORTING_REPOSITORY}" --jq '.default_branch')
          run_id=$(gh api --method POST \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPORTING_REPOSITORY}/actions/workflows/${RECEIVING_WORKFLOW}/dispatches" \
            -f "ref=${ref}" -f "inputs[check_id]=${check_id}" \
            -F return_run_details=true --jq '.workflow_run_id')
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Dispatch did not return a valid workflow_run_id."
            exit 1
          fi
          echo "Receiving run: https://github.com/${REPORTING_REPOSITORY}/actions/runs/${run_id}" \
            >> "$GITHUB_STEP_SUMMARY"
          gh run watch "${run_id}" -R "${REPORTING_REPOSITORY}" --exit-status
